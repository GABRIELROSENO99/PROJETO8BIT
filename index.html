<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analista de Ações Nimbus 3000</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Estilos globais e dark mode */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e; /* Azul Escuro Fundo */
            color: #e4e4e7; /* Texto principal claro */
        }
        .container-card {
            max-width: 900px;
            /* Centralização horizontal garantida pelo body flexbox, mas mantemos o max-width */
            padding: 2rem 1rem;
            background-color: #16162a; /* Card principal ligeiramente mais escuro */
            margin: auto; /* Garante que o card se auto-centralize e não estique mais que o max-width */
        }
        .input-group, .button-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }
        #results {
            white-space: pre-wrap;
            min-height: 150px;
            transition: all 0.3s ease;
        }
        .loading-animation {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #10b981; /* Verde esmeralda */
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Estilo para listas dentro do resultado */
        #results ul {
            list-style: disc;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        #results li {
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4"> <!-- Adicionado min-h-screen, flex, items-center e justify-center para centralização total -->
    <div class="container-card shadow-2xl rounded-2xl p-6 md:p-10 border border-indigo-900 w-full"> <!-- Adicionado w-full para melhor responsividade -->
        <h1 class="text-4xl font-extrabold text-indigo-400 mb-2">Analista de Ações Nimbus 3000📈</h1>
        <p class="text-gray-400 mb-6">Insira o ticker do ativo (ex: GOOG, PETR4.SA) e escolha uma análise. Os dados são pesquisados em tempo real.</p>
        <!-- Seção de Entrada -->
        <div class="input-group mb-6 flex-col sm:flex-row">
            <input type="text" id="tickerInput" placeholder="Ex: GOOG ou PETR4.SA"
                   class="flex-grow p-4 border border-indigo-700 bg-gray-900 text-gray-200 rounded-xl focus:ring-emerald-500 focus:border-emerald-500 transition duration-150 shadow-inner">
            <button id="clearButton" onclick="clearResults()"
                    class="w-full sm:w-auto px-6 py-4 bg-gray-700 text-gray-200 font-semibold rounded-xl hover:bg-gray-600 transition duration-150 shadow-md">
                Limpar
            </button>
        </div>
        <!-- Seção de Botões de Análise -->
        <div class="button-group flex-wrap justify-center sm:justify-start mb-8">
            <button onclick="analyzeStock('fundamental')"
                    class="flex items-center justify-center px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 min-w-[160px] m-1">
                Análise Fundamentalista
            </button>
            <button onclick="analyzeStock('technical')"
                    class="flex items-center justify-center px-6 py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-emerald-500 min-w-[160px] m-1">
                Análise Técnica
            </button>
            <button onclick="analyzeStock('momentum')"
                    class="flex items-center justify-center px-6 py-3 bg-amber-600 text-white font-semibold rounded-xl hover:bg-amber-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-amber-500 min-w-[160px] m-1">
                Análise de Momentum
            </button>
            <button onclick="analyzeStock('valuation')"
                    class="flex items-center justify-center px-6 py-3 bg-purple-600 text-white font-semibold rounded-xl hover:bg-purple-700 transition duration-150 shadow-lg transform hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-purple-500 min-w-[160px] m-1">
                Análise de Valuation
            </button>
        </div>
        <!-- Seção de Resultados -->
        <div class="bg-gray-700 p-6 rounded-xl border border-gray-600 shadow-inner">
            <h2 class="text-xl font-bold text-gray-200 mb-4 flex items-center">
                <span id="analysisTitle" class="truncate">Resultados da Análise</span>
            </h2>
            <!-- Container onde os cards e o texto serão inseridos -->
            <div id="resultsContainer">
                <div id="cardsSection"></div>
                <div id="results" class="text-gray-300 leading-relaxed min-h-[100px] mt-4">
                    Aguardando o ticker e o tipo de análise...
                </div>
            </div>
           
            <div id="sourcesContainer" class="mt-6 pt-4 border-t border-gray-600 text-sm text-gray-400"></div>
        </div>
        <!-- Seção de Mensagens/Erros (Para substituir alert()) -->
        <div id="messageBox" class="fixed bottom-4 right-4 p-4 rounded-lg shadow-xl hidden transition-opacity duration-300" role="alert"></div>
    </div>
    <script>
        // Variáveis Globais do Canvas (MANDATÓRIAS)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const modelName = 'gemini-2.5-flash-preview-09-2025';
        // --- Funções de Utilitário e UI ---
        function showMessage(message, type = 'info') {
            const box = document.getElementById('messageBox');
            box.textContent = message;
            box.classList.remove('hidden', 'opacity-0');
            box.classList.add('opacity-100');
           
            let bgColor = 'bg-blue-800 border-blue-600 text-blue-200';
            if (type === 'error') bgColor = 'bg-red-800 border-red-600 text-red-200';
            if (type === 'success') bgColor = 'bg-green-800 border-green-600 text-green-200';
           
            box.className = `fixed bottom-4 right-4 p-4 rounded-lg shadow-xl transition-opacity duration-300 border ${bgColor}`;
            setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0');
                setTimeout(() => { box.classList.add('hidden'); }, 300);
            }, 5000);
        }
        function clearResults() {
            document.getElementById('tickerInput').value = '';
            document.getElementById('results').innerHTML = 'Aguardando o ticker e o tipo de análise...';
            document.getElementById('cardsSection').innerHTML = '';
            document.getElementById('analysisTitle').textContent = 'Resultados da Análise';
            document.getElementById('sourcesContainer').innerHTML = '';
        }
        // --- Configuração de Análise ---
        function getAnalysisConfig(analysisType, ticker) {
            let systemPrompt = "";
            let userQuery = "";
            let title = "";
           
            // INSTRUÇÃO REFORÇADA E UNIFICADA para cards
            let cardInstruction = "A análise DEVE começar imediatamente (sem texto introdutório) com uma lista Markdown de exatamente 6 'INDICADORES CHAVE'. Use o formato EXATO para cada item da lista (começando em uma nova linha): `- **[MÉTRICA]:** [VALOR] | Status: [STATUS_COLOR_KEY]`. As chaves de status **MANDATÓRIAS** para coloração são: 'COMPRA', 'VENDA', ou 'NEUTRO'.";
           
            switch (analysisType) {
                case 'fundamental':
                    title = "Análise Fundamentalista - " + ticker;
                    const fundamentalCards = "Os cards DEVEM ser exatamente estes: 1. Dívida Líquida / EBITDA Atual (Foco: Saúde Financeira). 2. ROE (Return on Equity) (Foco: Rentabilidade). 3. ROIC (Return on Invested Capital) vs WACC (Foco: Eficiência e Criação de Valor). 4. CAGR de Receita (5 Anos) (Foco: Crescimento). 5. Liquidez Corrente (Foco: Solidez de Curto Prazo). 6. Margem Líquida (Foco: Lucratividade Operacional).";
                    systemPrompt = `Você é um analista fundamentalista experiente. ${cardInstruction} ${fundamentalCards} Após os cards, para cada card, inclua uma seção explicativa chamada 'Lição do Card [Número]', detalhando: O Cenário: O que está sendo comparado. O Significado: O que a métrica/indicador realmente representa. O Ideal: O que o investidor/trader deve buscar. Em seguida, forneça uma Análise Detalhada com subtópicos: Balanço Patrimonial, Demonstração de Resultados (DRE), Análise Setorial/Vantagem Competitiva (Moat). Finalize com uma Conclusão: Resumo final e direcionamento (Alvo, Tendência, Classificação). O resultado deve ser formatado em Markdown com títulos e listas. Gere a análise fundamentalista mais completa possível com foco em Saúde Financeira, Rentabilidade e Posição Competitiva.`;
                    userQuery = `Forneça a análise fundamentalista mais recente para o ativo: ${ticker}.`;
                    break;
                case 'technical':
                    title = "Análise Técnica Completa - " + ticker;
                    cardInstruction = "A análise DEVE começar imediatamente (sem texto introdutório) com uma lista Markdown de 6 a 9 'INDICADORES CHAVE'. Use o formato EXATO para cada item da lista (começando em uma nova linha): `- **[MÉTRICA]:** [VALOR] | Status: [STATUS_COLOR_KEY]`. As chaves de status **MANDATÓRIAS** para coloração são: 'COMPRA', 'VENDA', ou 'NEUTRO'.";
                    const technicalCards = "Os cards DEVEM incluir pelo menos: Suporte Horizontal Imediato (Foco: Risco/Reversão (Piso)), Resistência Horizontal Imediata (Foco: Alvo/Reversão (Teto)), Preço Atual. Outros cards sugeridos: 1. Média Móvel Exponencial (MME) de 200 Períodos (Foco: Tendência Primária). 2. RSI (Índice de Força Relativa) e Nível (Foco: Momentum e Sobrecomprado/Vendido). 3. Bandas de Bollinger (Largura) (Foco: Volatilidade). 6. Volume Financeiro Médio (VMA) x Volume Atual (Foco: Confirmação da Força).";
                    systemPrompt = `Você é um analista técnico de mercado de ações de elite. ${cardInstruction} ${technicalCards} Após os cards, para cada card, inclua uma seção explicativa chamada 'Lição do Card [Número]', detalhando: O Cenário: O que está sendo comparado. O Significado: O que a métrica/indicador realmente representa. O Ideal: O que o investidor/trader deve buscar. Em seguida, forneça uma Análise Detalhada com subtópicos: Identificação de Padrões Gráficos, Níveis de Fibonacci e Conclusão de Tendência com Sugestão de Ponto de Entrada/Saída. Finalize com uma Conclusão: Resumo final e direcionamento (Alvo, Tendência, Classificação). Use o formato Markdown. Gere a análise técnica mais completa possível, focada em Tendências, Padrões e Força do Preço, no timeframe diário.`;
                    userQuery = `Realize a análise técnica para a ação/ativo: ${ticker}.`;
                    break;
                case 'momentum':
                    title = "Análise de Momentum - " + ticker;
                    const momentumCards = "Os cards DEVEM ser exatamente estes: 1. Retorno Total (Últimos 12 Meses) (Foco: Força Absoluta (Longo Prazo)). 2. Retorno da Ação vs Índice de Referência (12 Meses) (Foco: Força Relativa (Outperformance)). 3. Retorno dos Últimos 3 Meses (Foco: Curva de Curto Prazo). 4. Retorno dos Últimos 6 Meses (Foco: Curva de Médio Prazo). 5. Taxa de Variação (RoC) de 20 Períodos (Foco: Persistência da Tendência). 6. Posição no Ranking de Momentum (Percentil) (Foco: Classificação em relação aos Pares).";
                    systemPrompt = `Você é um especialista em estratégias de momentum de curto prazo. ${cardInstruction} ${momentumCards} Após os cards, para cada card, inclua uma seção explicativa chamada 'Lição do Card [Número]', detalhando: O Cenário: O que está sendo comparado. O Significado: O que a métrica/indicador realmente representa. O Ideal: O que o investidor/trader deve buscar. Em seguida, forneça uma Análise Detalhada com subtópicos: Comparação de Retornos em diferentes janelas, Utilização de Indicadores de Momentum (MACD) e Conclusão sobre a Posição da Ação na Curva (Aceleração/Desaceleração). Finalize com uma Conclusão: Resumo final e direcionamento (Alvo, Tendência, Classificação). Use o formato Markdown. Gere a análise de Momentum mais completa possível, focada na Força e Persistência da Tendência de Preço, comparando a ação com o índice de referência apropriado (e.g., S&P 500 para ações US, Ibovespa para ações BR).`;
                    userQuery = `Realize a análise de momentum para a ação/ativo: ${ticker}.`;
                    break;
                case 'valuation':
                    title = "Análise de Valuation - " + ticker;
                    const valuationCards = "Os cards DEVEM ser exatamente estes: 1. P/L Atual vs Média Histórica (Foco: Preço vs Lucro). 2. PEG Ratio e Classificação (Foco: Preço vs Crescimento). 3. EV/EBITDA vs Média do Setor (Foco: Valor da Empresa). 4. P/VP (Preço/Valor Patrimonial) (Foco: Preço vs Valor Contábil). 5. Retorno Implícito (DCF) (Foco: Valor Intrínseco). 6. Preço Justo Alvo (Média Ponderada) (Foco: Conclusão de Preço).";
                    systemPrompt = `Você é um analista de valuation experiente. O objetivo é determinar se a empresa está sobrevalorizada, justamente valorizada ou subvalorizada no mercado atual e entender seu potencial de crescimento futuro. ${cardInstruction} ${valuationCards} Após os cards, para cada card, inclua uma seção explicativa chamada 'Lição do Card [Número]', detalhando: O Cenário: O que está sendo comparado. O Significado: O que a métrica/indicador realmente representa. O Ideal: O que o investidor/trader deve buscar. Em seguida, forneça uma Análise Detalhada com subtópicos: Detalhamento dos Múltiplos, Análise da Taxa de Crescimento (Growth Rate), Projeção Simplificada de Fluxo de Caixa Livre e Conclusão Final de Valuation com Margem de Segurança. Finalize com uma Conclusão: Resumo final e direcionamento (Alvo, Tendência, Classificação). Use o formato Markdown com títulos e listas. Gere a análise fundamentalista com foco em Valuation mais completa possível, utilizando múltiplos e metodologias de precificação para determinar o Preço Justo.`;
                    userQuery = `Forneça a análise de valuation racional mais recente para o ativo: ${ticker}.`;
                    break;
                default:
                    throw new Error("Tipo de análise desconhecido.");
            }
            return { systemPrompt, userQuery, title };
        }
        // --- Lógica de Chamada da API ---
        async function fetchWithBackoff(url, options, maxRetries = 5) {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                   
                    if (!response.ok) {
                          const errorBody = await response.json().catch(() => ({}));
                          const errorMessage = errorBody.error?.message || `Erro HTTP: ${response.status} ${response.statusText}`;
                          throw new Error(`Falha na API: ${errorMessage}`);
                    }
                   
                    if (response.status !== 429) {
                        return response;
                    }
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    // console.warn(`[API] Limite de taxa atingido. Tentando novamente em ${Math.round(delay / 1000)}s.`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                } catch (error) {
                    // console.error("[API] Erro durante o fetch, tentando novamente:", error);
                    if (i === maxRetries - 1) throw error;
                    const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            throw new Error("Falha na chamada da API após várias tentativas.");
        }
        // Função principal que chama o Gemini API
        async function analyzeStock(analysisType) {
            const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
            const resultsDiv = document.getElementById('results');
            const cardsDiv = document.getElementById('cardsSection');
            const sourcesDiv = document.getElementById('sourcesContainer');
            const titleElement = document.getElementById('analysisTitle');
            if (!ticker) {
                showMessage("Por favor, insira um ticker de ação (ex: GOOG).", 'error');
                return;
            }
            titleElement.innerHTML = `<span class="loading-animation"></span> Gerando ${analysisType.charAt(0).toUpperCase() + analysisType.slice(1)} para ${ticker}...`;
            resultsDiv.innerHTML = '<p class="text-gray-400 italic">Estou fazendo em segundos o trabalho que você levaria horas, então deixa o papai aqui trabalhar e aguarde mais alguns segundos</p>';
            cardsDiv.innerHTML = '';
            sourcesDiv.innerHTML = '';
            try {
                const config = getAnalysisConfig(analysisType, ticker);
                // Usa a chave API definida acima
                const apiUrl = '/.netlify/functions/gemini-proxy'; // Isso chama o backend no mesmo site
                const payload = {
                    contents: [{ parts: [{ text: config.userQuery }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: config.systemPrompt }]
                    }
                };
                const response = await fetchWithBackoff(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const candidate = result.candidates?.[0];
                if (!candidate || !candidate.content?.parts?.[0]?.text) {
                    console.error("Resposta API bruta (candidate missing content):", JSON.stringify(result, null, 2));
                    throw new Error("Resposta inválida da API ou conteúdo vazio.");
                }
                let generatedText = candidate.content.parts[0].text;
               
                // 1. Processar e renderizar os cards
                const { cardHtml, cleanedMarkdown } = renderKeyMetricsAsCards(generatedText);
                cardsDiv.innerHTML = cardHtml;
               
                // 2. Formatar o restante do texto
                const formattedText = formatMarkdownToHtml(cleanedMarkdown);
                resultsDiv.innerHTML = formattedText;
                titleElement.textContent = config.title;
                // 3. Extrair e exibir as fontes (citações)
                const sources = extractGroundingSources(candidate);
                if (sources.length > 0) {
                    const uniqueSources = Array.from(new Set(sources.map(s => s.uri)))
                        .map(uri => sources.find(s => s.uri === uri));
                    const sourcesHtml = 'Fontes Consultadas: ' + uniqueSources.map((s, index) =>
                        `<a href="${s.uri}" target="_blank" class="text-indigo-400 hover:text-indigo-300 underline">${s.title} (${index + 1})</a>`
                    ).join(', ');
                    sourcesDiv.innerHTML = sourcesHtml;
                } else {
                    sourcesDiv.innerHTML = 'Nenhuma fonte citada pelo modelo.';
                }
                showMessage("Análise gerada com sucesso!", 'success');
            } catch (error) {
                console.error("Erro na análise:", error);
                titleElement.textContent = 'Erro na Análise';
                resultsDiv.innerHTML = `<p class="text-red-500">Ocorreu um erro ao processar sua solicitação: ${error.message}. Por favor, tente novamente.</p>`;
                cardsDiv.innerHTML = '';
                sourcesDiv.innerHTML = '';
                showMessage(`Falha ao gerar análise: ${error.message}`, 'error');
            }
        }
        // Função para extrair fontes
        function extractGroundingSources(candidate) {
            let sources = [];
            const groundingMetadata = candidate.groundingMetadata;
            if (groundingMetadata && groundingMetadata.groundingAttributions) {
                sources = groundingMetadata.groundingAttributions
                    .map(attribution => ({
                        uri: attribution.web?.uri,
                        title: attribution.web?.title,
                    }))
                    .filter(source => source.uri && source.title);
            }
            return sources;
        }
        // --- Funções de Renderização ---
       
        // Função para identificar e renderizar as métricas chave como cards coloridos
        function renderKeyMetricsAsCards(markdown) {
            // Padrão: - **[MÉTRICA]:** [VALOR] | Status: [STATUS/AÇÃO]
            // Usamos 'gim' para encontrar o padrão em múltiplas linhas.
            const cardPattern = /^\s*-\s*\*\*(.*?):\*\*\s*(.*?)\s*\|\s*Status:\s*(.*)/gim;
            let match;
            const cards = [];
            const matchedLines = [];
            const originalText = markdown;
            // Encontra todas as linhas de métricas
            while ((match = cardPattern.exec(markdown)) !== null) {
                const line = match[0].trim();
                const metric = match[1].trim();
                const value = match[2].trim();
                const status = match[3].trim();
                cards.push({ metric, value, status });
                // Adiciona a linha completa ao array para remoção posterior
                matchedLines.push(line);
            }
            // Se não encontrou cards, retorna o markdown original
            if (cards.length === 0) return { cardHtml: '', cleanedMarkdown: markdown };
            // Remove todas as linhas de cards encontradas do texto original
            let cleanedMarkdown = originalText;
            matchedLines.forEach(line => {
                // Remove a linha casada e qualquer linha vazia/espaço em branco ao redor
                // Usamos um regex mais seguro para garantir que a remoção funcione em qualquer posição
                cleanedMarkdown = cleanedMarkdown.replace(new RegExp(line.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'), 'g'), '').trim();
            });
            // Remove o cabeçalho 'INDICADORES CHAVE' se o modelo o tiver adicionado (apesar da instrução)
            cleanedMarkdown = cleanedMarkdown.replace(/#+\s*INDICADORES CHAVE\s*/gi, '').trim();
           
            let cardsHtml = '<div class="flex flex-wrap gap-4 mb-6">'; // Adiciona margem inferior para separar do texto
           
            cards.forEach(card => {
                let colorClass = 'bg-gray-700 border-gray-600'; // Default Neutro/Info/Fallback
                let indicatorColor = 'text-gray-400';
               
                // Definir cores baseadas no status/tom (focado nas palavras-chave COMPRA, VENDA, NEUTRO)
                const statusLower = card.status.toLowerCase();
               
                // COMPRA (Verde)
                if (statusLower.includes('compra') || statusLower.includes('alta') || statusLower.includes('forte') || statusLower.includes('positivo') || statusLower.includes('bullish')) {
                    colorClass = 'bg-emerald-800/70 border-emerald-600';
                    indicatorColor = 'text-emerald-400';
                // VENDA (Vermelho)
                } else if (statusLower.includes('venda') || statusLower.includes('baixa') || statusLower.includes('fraco') || statusLower.includes('negativo') || statusLower.includes('bearish')) {
                    colorClass = 'bg-red-800/70 border-red-600';
                    indicatorColor = 'text-red-400';
                // NEUTRO (Amarelo/Âmbar)
                } else if (statusLower.includes('neutro') || statusLower.includes('estável') || statusLower.includes('espera') || statusLower.includes('lateral')) {
                    colorClass = 'bg-amber-800/70 border-amber-600';
                    indicatorColor = 'text-amber-400';
                }
                cardsHtml += `
                    <div class="flex-1 min-w-[140px] p-4 rounded-xl shadow-lg transition duration-300 ${colorClass} border">
                        <p class="text-sm font-medium text-gray-300 uppercase truncate">${card.metric}</p>
                        <p class="text-2xl font-extrabold mt-1 ${indicatorColor}">${card.value}</p>
                        <p class="text-xs mt-1 font-semibold text-gray-200">${card.status}</p>
                    </div>
                `;
            });
            cardsHtml += '</div>';
            return { cardHtml: cardsHtml, cleanedMarkdown: cleanedMarkdown };
        }
        // Função para converter o formato Markdown do Gemini em HTML
        function formatMarkdownToHtml(markdown) {
            let html = markdown;
            // Converter negrito (**) e (__)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__(.*?)__/g, '<strong>$1</strong>');
            // Converter itálico (*) e (_)
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/_(.*?)_/g, '<em>$1</em>');
            // Converter cabeçalhos Markdown (#) para <h4>
            html = html.replace(/^### (.*$)/gim, '<h4 class="text-lg font-bold text-gray-200 mt-4 mb-2">$1</h4>');
            html = html.replace(/^## (.*$)/gim, '<h4 class="text-xl font-bold text-gray-200 mt-4 mb-2">$1</h4>');
            html = html.replace(/^# (.*$)/gim, '<h4 class="text-2xl font-bold text-indigo-400 mt-4 mb-2">$1</h4>');
            // Converte listas desordenadas (-) e (*) para <ul><li>
            // Troca os marcadores de lista por <li>
            html = html.replace(/^\s*[\-\*]\s+(.*$)/gim, '<li>$1</li>');
            // Envolve os blocos de <li> em <ul> (Lógica de correção de lista)
            if (html.includes('<li>')) {
                let lines = html.split('\n');
                let inList = false;
                let finalHtml = [];
                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (trimmedLine.startsWith('<li>') && !inList) {
                        finalHtml.push('<ul>');
                        inList = true;
                    } else if (!trimmedLine.startsWith('<li>') && inList) {
                        finalHtml.push('</ul>');
                        inList = false;
                    }
                    // Adiciona a linha (seja <li> ou texto normal)
                    finalHtml.push(line);
                });
               
                // Fecha a última tag <ul> se ainda estiver aberta
                if (inList) {
                    finalHtml.push('</ul>');
                }
                html = finalHtml.join('\n');
            }
            // Converter parágrafos (qualquer coisa que não seja tag ou cabeçalho)
            html = html.split('\n').map(line => {
                const trimmedLine = line.trim();
                // Verifica se a linha não está vazia e não é o início de uma tag de bloco já convertida
                if (trimmedLine === '' || trimmedLine.match(/<h|<ul|<\/ul|<li|<strong|<em|<a/i)) {
                    return line;
                }
                // Adiciona tags de parágrafo ao redor do texto
                return `<p>${trimmedLine}</p>`;
            }).join('\n');
            // Limpa linhas em branco que podem ter sobrado
            html = html.replace(/(\n\s*){2,}/g, '\n\n');
            return html;
        }
    </script>
</body>
</html>
